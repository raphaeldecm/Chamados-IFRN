services:
  ifrn_datasource:
    image: postgres:17
    container_name: ifrn_datasource
    environment:
      POSTGRES_DB: ${DATASOURCE_NAME}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ifrn_data_base:/var/lib/postgresql/data

volumes:
  ifrn_data_base:
